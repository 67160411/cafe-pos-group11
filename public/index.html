
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe POS | Group 11</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Cafe POS</h1>
      <p>ระบบจัดการร้านกาแฟ</p>
    </div>

    <label>
      สาขาที่ใช้งาน
      <select id="branch-select">
        <option value="">กำลังโหลดสาขา...</option>
      </select>
    </label>
  </header>

  <nav class="navigation">
    <button class="nav-button active" data-page="pos-page">
      รับออเดอร์
    </button>
    <button class="nav-button" data-page="menu-page">
      จัดการเมนู
    </button>
    <button class="nav-button" data-page="report-page">
      รายงานยอดขาย
    </button>
  </nav>

  <main>
    <p id="global-message" role="status" aria-live="polite"></p>

    <!-- หน้า 1: POS -->
    <section id="pos-page" class="page">
      <h2>รับออเดอร์</h2>

      <div class="pos-layout">
        <section class="panel">
          <h3>เลือกเมนู</h3>
          <label>
            ค้นหาเมนู
            <input id="menu-search"
                   type="search"
                   placeholder="พิมพ์ชื่อเมนู">
          </label>
          <div id="pos-menu-list" class="menu-grid">
            กำลังโหลดเมนู...
          </div>
        </section>

        <section class="panel cart-panel">
          <h3>ตะกร้าสินค้า</h3>
          <div id="cart-items">
            ยังไม่มีสินค้า
          </div>

          <div class="total-row">
            <span>ยอดรวม</span>
            <strong id="cart-total">0.00 บาท</strong>
          </div>

          <label>
            รหัสพนักงาน
            <input id="employee-id"
                   type="number"
                   min="1"
                   step="1"
                   required
                   placeholder="กรอกรหัสพนักงาน">
          </label>

          <label>
            วิธีชำระเงิน
            <select id="payment-method">
              <option value="cash">เงินสด</option>
              <option value="qr">QR Payment</option>
              <option value="card">บัตร</option>
            </select>
          </label>

          <button id="confirm-order" class="primary-button" disabled>
            ยืนยันออเดอร์
          </button>
          <button id="clear-cart" class="secondary-button">
            ล้างตะกร้า
          </button>
        </section>
      </div>

      <section id="receipt-panel" class="panel" hidden>
        <div id="receipt-content"></div>
        <button id="print-receipt">พิมพ์ใบเสร็จ</button>
      </section>
    </section>

    <!-- หน้า 2: จัดการเมนู -->
    <section id="menu-page" class="page" hidden>
      <h2>จัดการเมนู</h2>

      <section class="panel">
        <h3 id="menu-form-title">เพิ่มเมนูใหม่</h3>

        <form id="menu-form">
          <input id="editing-menu-id" type="hidden">

          <label>
            ชื่อเมนู
            <input id="menu-name"
                   type="text"
                   maxlength="100"
                   required>
          </label>

          <label>
            หมวดหมู่
            <select id="category-id" required>
              <option value="">เลือกหมวดหมู่</option>
            </select>
          </label>

          <label>
            ราคา (บาท)
            <input id="menu-price"
                   type="number"
                   min="0.01"
                   step="0.01"
                   required>
          </label>

          <label>
            จำนวนสต็อก
            <input id="menu-stock"
                   type="number"
                   min="0"
                   step="1"
                   value="0"
                   required>
          </label>

          <button type="submit" class="primary-button">
            บันทึกเมนู
          </button>
          <button type="button" id="cancel-edit"
                  class="secondary-button">
            ยกเลิก
          </button>
        </form>
      </section>

      <section class="panel">
        <h3>รายการเมนูทั้งหมด</h3>
        <div id="manage-menu-list">กำลังโหลดเมนู...</div>
      </section>
    </section>

    <!-- หน้า 3: รายงานยอดขาย -->
    <section id="report-page" class="page" hidden>
      <h2>รายงานยอดขาย</h2>

      <section class="panel">
        <form id="report-filter">
          <label>
            ตั้งแต่วันที่
            <input id="report-from" type="date" required>
          </label>
          <label>
            ถึงวันที่
            <input id="report-to" type="date" required>
          </label>
          <button type="submit" class="primary-button">
            ดูรายงาน
          </button>
        </form>
      </section>

      <div class="summary-grid">
        <section class="panel">
          <p>ยอดขายรวม</p>
          <strong id="report-revenue">—</strong>
        </section>
        <section class="panel">
          <p>จำนวนออเดอร์</p>
          <strong id="report-orders">—</strong>
        </section>
        <section class="panel">
          <p>จำนวนชิ้นที่ขาย</p>
          <strong id="report-quantity">—</strong>
        </section>
      </div>

      <section class="panel">
        <h3>ยอดขายแยกตามเมนู</h3>
        <div id="report-menu-list">
          ยังไม่ได้โหลดรายงาน
        </div>
      </section>
    </section>
  </main>
</body>
</html>
